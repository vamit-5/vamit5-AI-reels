name: VAMIT-5 Recovery Reels

on:
  schedule:
    # PRIVREMENO smanjeno na 2x dnevno (umesto 10x) -- nov nalog bez
    # istorije koji odmah objavljuje 10x/dan preko API-ja izgleda algoritmu
    # kao spam pattern i moze biti razlog za 0 pregleda van pratilaca.
    # Vracamo postepeno na vise kad nalog izgradi malo poverenja/istorije
    # (obicno 2-3 nedelje). 08:00 i 18:00 po srpskom letnjem vremenu (UTC+2)
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vamit5-recovery-reels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instaliraj Python zavisnosti
        run: pip install -r requirements.txt

      - name: Pokreni generisanje i objavu
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ALLOWED_UTC_HOUR_WINDOWS: ""  # prazno = uvek dozvoljeno, tacno vreme kontrolisu cron termini iznad
        run: python main.py
